<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Untuk Uwaa ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle,#651d45,#18091f);
    color: white;
    font-family: Arial,sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 600px;
}

.heart {
    font-size: 80px;
    animation: pulse 1.5s infinite;
}

h1 {
    font-size: 45px;
    color: #ff9bc4;
}

p {
    font-size: 18px;
    line-height: 1.8;
    color: #f5e5ed;
}

.final {
    margin-top: 30px;
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,.08);
}

.signature {
    margin-top: 25px;
    font-size: 22px;
    color: #ff9bc4;
}

@keyframes pulse {
    50% {
        transform: scale(1.15);
    }
}
</style>
</head>

<body>

<div class="container">

<div class="heart">❤️</div>

<h1>Uwaa</h1>

<div class="final">

<p>
Kalau nanti Uwaa bertanya...
</p>

<p>
<strong>
"Kenapa Ell masih memilih Uwaa?"
</strong>
</p>

<p>
Jawabannya sebenarnya sederhana.
</p>

<p style="font-size:24px;color:#ff9bc4;">
Karena hati Ell masih menemukan
rumahnya di Uwaa. ❤️
</p>

<p>
Ell mungkin nggak sempurna,
tapi perasaan Ell ke Uwaa
adalah sesuatu yang benar-benar Ell hargai.
</p>

<div class="signature">
— Ell, untuk Uwaa ❤️
</div>

</div>

</div>

</body>
</html>
